<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Mini-Project</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="CSS Mini-Project.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  </head>
  <body>
    <div class="main-body">
      <input type="checkbox" id="check" />
      <div class="btn_one">
        <label for="check">
          <i class="fa-solid fa-bars"></i>
        </label>
      </div>
      <div class="sidebar">
         <div class="btn_two">
            <label for="check">
              <i class="fa-solid fa-xmark"></i>
            </label>
          </div>
        <div class="sidebar-heading">
          <div class="logo"><a href="#">Canvas Explore</a></div>
        </div>
        <div class="sidebar-options">
          <div class="options">
            <i class="fa-solid fa-image"></i>
            <a href="#">Gallery</a>
          </div>
          <div class="options">
            <i class="fa-solid fa-arrow-up-right-from-square"></i>
            <a href="#">Shortcuts</a>
          </div>
          <div class="options">
            <i class="fa-solid fa-photo-film"></i>
             <a href="#">Exibits</a>
          </div>
          <div class="options">
            <i class="fa-solid fa-calendar-days"></i>
            <a href="#">Events</a>
          </div>
          <div class="options">
            <i class="fa-solid fa-store"></i>
            <a href="#">Store</a>
          </div>
          <div class="options">
            <i class="fa-solid fa-phone"></i>
            <a href="#">Contact</a>
          </div>
          <div class="options">
            <i class="fa-regular fa-comments"></i>
            <a href="#">Feedback</a>
          </div>
        </div>
        <div class="social-media">
          <div>
          <a href="#"><i class="fa-brands fa-facebook icon"></i></i></a>
          <a href="#"><i class="fa-brands fa-twitter icon"></i></a>
          <a href="#"><i class="fa-brands fa-instagram icon"></i></i></a>
          <a href="#"><i class="fa-brands fa-youtube icon"></i></a>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
