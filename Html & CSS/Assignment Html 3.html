        <!--Quetion 1-->
   
    <table border="black">

        <!--Quetion 2-->
    
     <hr color="Grey">

    <form action="/action">
        
        <div>
            <label for="Name">Name:</label>
            <input type="text" id="Name" name="Name">
        </div>
        
       <div>
            <label for="gender">Sex:</label>
            <input type="radio" id="gender" name="sex" value="Male" >
            <label for="gender">Male</label>
            <input type="radio" id="gender" name="sex" value="Female" >
            <label for="gender">Female</label>
       </div>

       <div>
            <label for="country">Country:</label>
            <select name="Country" id="country">
                <option value="1">Select an option</option>
                <option value="2">India</option>
                <option value="3">USA</option>
                <option value="4">Australia</option>
                <option value="5">Japan</option>
            </select>
       </div>

        <div>
            <label for="feedback">Message:</label>
            <br>
            <textarea id="feedback" rows="5"></textarea>
        </div>
        
        <div>
            <input type="checkbox" id="yes" name="Subscribe">
            <label for="yes">Subscribe?</label>
        </div>
        <button>Submit</button>

    </form>

     <hr color="Grey">
    
        <!--Quetion 3-->

    <form action="/action">
    
        <h1>Feedback Form</h1>
        <div>
            <label for="name">Name:</label>
            <input type="text" id="name" placeholder="Write your name">
        </div>
        <div>
            <label for="email">Email::</label>
            <input type="email" id="email" placeholder="Write your email">
        </div>
        <div>
            <label for="message">Message:</label>
            <br>
            <textarea name="message" id="message" rows="6"></textarea>
        </div>
        <div>
            <label for="">Rate us out of 5:</label>
            <br>
            <input type="checkbox" id="pick" name="1">
            <label for="pick">1</label>
            <br>
            <input type="checkbox" id="pick" name="2">
            <label for="pick">2</label>
            <br>
            <input type="checkbox" id="pick" name="3">
            <label for="pick">3</label>
            <br>
            <input type="checkbox" id="pick" name="4">
            <label for="pick">4</label>
            <br>
            <input type="checkbox" id="pick" name="5">
            <label for="pick">5</label>
        </div>
        <button>Send your message!</button>

    </form>
